# Railway config-as-code for the AIRI web UI (stage-web).
# In Railway: Service > Settings > Config-as-code > set path to
#   /apps/stage-web/railway.stage-web.toml
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/stage-web/Dockerfile.railway"
watchPatterns = [
  "apps/stage-web/**",
  "packages/**",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml"
]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
